<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твой ремонт готов — PRO (Админ и Клиент)</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-10">

    <!-- Шапка приложения -->
    <header class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-10">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center text-slate-900 text-xl font-bold shadow-md">
                    <i class="fa-solid fa-calculator"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg leading-tight tracking-wide">Твой ремонт <span class="text-emerald-400">ГОТОВ</span></h1>
                    <p class="text-xs text-slate-400">Клиент + Админ (PRO)</p>
                </div>
            </div>
            <span class="text-xs bg-slate-800 text-emerald-400 font-semibold px-2.5 py-1 rounded-full border border-slate-700">v3.0</span>
        </div>
    </header>

    <!-- Переключатель вкладок: Клиент / Админ -->
    <div class="max-w-md mx-auto px-4 mt-4">
        <div class="bg-slate-200 p-1 rounded-xl flex">
            <button onclick="switchTab('client')" id="btnClient" class="flex-1 py-2.5 text-sm font-bold rounded-lg bg-white text-slate-900 shadow-sm transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-user text-emerald-600"></i> Клиент (Расчёт)
            </button>
            <button onclick="switchTab('admin')" id="btnAdmin" class="flex-1 py-2.5 text-sm font-bold rounded-lg text-slate-600 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-lock text-slate-500"></i> Админ (Цены)
            </button>
        </div>
    </div>

    <!-- Основной контейнер приложения -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- ВКЛАДКА 1: КЛИЕНТ (Калькулятор) -->
        <div id="tabClient" class="space-y-4">
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                <h2 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-ruler-combined text-emerald-600"></i> Параметры объекта
                </h2>

                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-600 mb-1 uppercase tracking-wider">Площадь помещения (м²)</label>
                    <div class="relative">
                        <input type="number" id="area" placeholder="Например: 45" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-900 text-lg font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
                        <span class="absolute right-4 top-3.5 text-slate-400 font-bold">м²</span>
                    </div>
                </div>

                <div class="mb-5">
                    <label class="block text-xs font-semibold text-slate-600 mb-1 uppercase tracking-wider">Тип ремонта</label>
                    <select id="repairType" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-900 text-base font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
                        <option value="cosmetic">Косметический</option>
                        <option value="capital" selected>Капитальный</option>
                        <option value="premium">Премиум</option>
                    </select>
                </div>

                <button onclick="calculateEstimate()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] text-slate-900 font-extrabold text-lg py-3.5 rounded-xl shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Рассчитать смету
                </button>
            </div>

            <!-- Результаты -->
            <div id="resultCard" class="hidden bg-slate-900 text-white rounded-2xl p-5 shadow-xl border border-slate-800 space-y-4">
                <div class="border-b border-slate-800 pb-3 flex justify-between items-center">
                    <span class="text-xs uppercase font-bold text-slate-400 tracking-wider">Предварительная смета</span>
                    <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded font-mono">Актуально</span>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between text-sm text-slate-300">
                        <span>Работы мастеров:</span>
                        <span id="workCost" class="font-semibold text-white">0 ₽</span>
                    </div>
                    <div class="flex justify-between text-sm text-slate-300">
                        <span>Материалы:</span>
                        <span id="materialCost" class="font-semibold text-white">0 ₽</span>
                    </div>
                    <div class="flex justify-between text-sm text-slate-400 text-xs">
                        <span>Запас (10%):</span>
                        <span id="reserveCost" class="font-mono">0 ₽</span>
                    </div>
                </div>

                <div class="pt-3 border-t border-slate-800 flex justify-between items-end">
                    <div>
                        <p class="text-xs text-slate-400">Итоговая стоимость:</p>
                        <p id="totalCost" class="text-2xl font-black text-emerald-400">0 ₽</p>
                    </div>
                </div>

                <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white font-bold text-sm py-3 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 mt-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i> Отправить смету в WhatsApp
                </button>
            </div>
        </div>

        <!-- ВКЛАДКА 2: АДМИН (Настройка цен за м²) -->
        <div id="tabAdmin" class="hidden space-y-4">
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-gears text-slate-700"></i> Настройка тарифов
                    </h2>
                    <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold">Панель мастера</span>
                </div>

                <!-- Косметический -->
                <div class="p-3 bg-slate-50 rounded-xl space-y-2 border border-slate-200">
                    <p class="font-bold text-sm text-slate-800">Косметический ремонт</p>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] uppercase font-bold text-slate-500">Работа (₽/м²)</label>
                            <input type="number" id="cosmWork" value="3500" class="w-full bg-white border border-slate-300 rounded-lg p-2 font-bold text-slate-900 text-sm">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase font-bold text-slate-500">Материалы (₽/м²)</label>
                            <input type="number" id="cosmMat" value="2500" class="w-full bg-white border border-slate-300 rounded-lg p-2 font-bold text-slate-900 text-sm">
                        </div>
                    </div>
                </div>

                <!-- Капитальный -->
                <div class="p-3 bg-slate-50 rounded-xl space-y-2 border border-slate-200">
                    <p class="font-bold text-sm text-slate-800">Капитальный ремонт</p>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] uppercase font-bold text-slate-500">Работа (₽/м²)</label>
                            <input type="number" id="capWork" value="8500" class="w-full bg-white border border-slate-300 rounded-lg p-2 font-bold text-slate-900 text-sm">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase font-bold text-slate-500">Материалы (₽/м²)</label>
                            <input type="number" id="capMat" value="6000" class="w-full bg-white border border-slate-300 rounded-lg p-2 font-bold text-slate-900 text-sm">
                        </div>
                    </div>
                </div>

                <!-- Премиум -->
                <div class="p-3 bg-slate-50 rounded-xl space-y-2 border border-slate-200">
                    <p class="font-bold text-sm text-slate-800">Премиум ремонт</p>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] uppercase font-bold text-slate-500">Работа (₽/м²)</label>
                            <input type="number" id="premWork" value="15000" class="w-full bg-white border border-slate-300 rounded-lg p-2 font-bold text-slate-900 text-sm">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase font-bold text-slate-500">Материалы (₽/м²)</label>
                            <input type="number" id="premMat" value="12000" class="w-full bg-white border border-slate-300 rounded-lg p-2 font-bold text-slate-900 text-sm">
                        </div>
                    </div>
                </div>

                <button onclick="savePrices()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Сохранить новые цены
                </button>
            </div>
        </div>

    </main>

    <!-- Скрипты управления -->
    <script>
        let lastCalculation = {};

        // Переключение между вкладками
        function switchTab(tab) {
            const clientTab = document.getElementById('tabClient');
            const adminTab = document.getElementById('tabAdmin');
            const btnClient = document.getElementById('btnClient');
            const btnAdmin = document.getElementById('btnAdmin');

            if (tab === 'client') {
                clientTab.classList.remove('hidden');
                adminTab.classList.add('hidden');
                btnClient.className = "flex-1 py-2.5 text-sm font-bold rounded-lg bg-white text-slate-900 shadow-sm transition-all flex items-center justify-center gap-2";
                btnAdmin.className = "flex-1 py-2.5 text-sm font-bold rounded-lg text-slate-600 transition-all flex items-center justify-center gap-2";
            } else {
                clientTab.classList.add('hidden');
                adminTab.classList.remove('hidden');
                btnAdmin.className = "flex-1 py-2.5 text-sm font-bold rounded-lg bg-white text-slate-900 shadow-sm transition-all flex items-center justify-center gap-2";
                btnClient.className = "flex-1 py-2.5 text-sm font-bold rounded-lg text-slate-600 transition-all flex items-center justify-center gap-2";
            }
        }

        // Сохранение цен администратора
        function savePrices() {
            alert('Цены успешно обновлены в памяти приложения!');
            switchTab('client');
        }

        // Расчёт с учетом админских цен
        function calculateEstimate() {
            const area = parseFloat(document.getElementById('area').value);
            const repairSelect = document.getElementById('repairType');
            const repairType = repairSelect.value;
            const repairTypeName = repairSelect.options[repairSelect.selectedIndex].text;

            if (!area || area <= 0) {
                alert('Пожалуйста, введите корректную площадь помещения.');
                return;
            }

            let workRate = 0;
            let materialRate = 0;

            if (repairType === 'cosmetic') {
                workRate = parseFloat(document.getElementById('cosmWork').value) || 3500;
                materialRate = parseFloat(document.getElementById('cosmMat').value) || 2500;
            } else if (repairType === 'capital') {
                workRate = parseFloat(document.getElementById('capWork').value) || 8500;
                materialRate = parseFloat(document.getElementById('capMat').value) || 6000;
            } else if (repairType === 'premium') {
                workRate = parseFloat(document.getElementById('premWork').value) || 15000;
                materialRate = parseFloat(document.getElementById('premMat').value) || 12000;
            }

            const workTotal = area * workRate;
            const materialTotal = area * materialRate;
            const subtotal = workTotal + materialTotal;
            const reserveTotal = subtotal * 0.10;
            const grandTotal = subtotal + reserveTotal;

            const formatter = new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 });

            lastCalculation = {
                area: area,
                type: repairTypeName,
                work: formatter.format(workTotal),
                materials: formatter.format(materialTotal),
                total: formatter.format(grandTotal)
            };

            document.getElementById('workCost').innerText = formatter.format(workTotal);
            document.getElementById('materialCost').innerText = formatter.format(materialTotal);
            document.getElementById('reserveCost').innerText = formatter.format(reserveTotal);
            document.getElementById('totalCost').innerText = formatter.format(grandTotal);

            document.getElementById('resultCard').classList.remove('hidden');
        }

        // Отправка в WhatsApp
        function sendToWhatsApp() {
            const text = `Здравствуйте! Предварительный расчёт по объекту:%0A` +
                         `- Площадь: ${lastCalculation.area} м²%0A` +
                         `- Тип ремонта: ${lastCalculation.type}%0A` +
                         `- Стоимость работ: ${lastCalculation.work}%0A` +
                         `- Материалы: ${lastCalculation.materials}%0A` +
                         `*Итого с запасом:* ${lastCalculation.total}%0A%0A` +
                         `Приложение: «Твой ремонт готов»`;

            window.open(`https://wa.me/?text=${text}`, '_blank');
        }
    </script>
</body>
</html>
